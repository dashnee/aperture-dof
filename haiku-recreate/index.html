<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Haiku 5.5 — 动效仿制 v2</title>
<style>
  :root{
    --bg:#0f0e0d; --ink:#f2efe9; --mute:#8a847b; --acc:#f0553a; --line:#2d2a27;
    --mono:"WenQuanYi Zen Hei Mono","DejaVu Sans Mono",monospace;
    --sans:"WenQuanYi Zen Hei","Noto Sans CJK SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;height:100%}
  #stage{position:relative;width:1080px;height:1920px;background:var(--bg);overflow:hidden;color:var(--ink);font-family:var(--sans)}
  .glow{position:absolute;inset:0;background:radial-gradient(640px 720px at 50% 45%,rgba(240,85,58,.22),transparent 70%)}
  .watermark{position:absolute;left:0;right:0;text-align:center;font-weight:900;color:#1d1b19;opacity:0;pointer-events:none;white-space:nowrap}
  .progress{position:absolute;top:0;left:0;height:6px;background:var(--acc);width:0;z-index:20}
  .scene{position:absolute;inset:0;pointer-events:none}
  .lbl{position:absolute;font:500 22px var(--mono);letter-spacing:.2em;color:var(--mute)}
  .title{position:absolute;font-weight:900;line-height:1.15}
  .sub{position:absolute;font-weight:300;color:var(--mute);font-size:44px}
  .hl{color:var(--acc)}
  .item{position:absolute;left:90px;right:90px;height:110px;display:flex;align-items:center;font-size:64px;font-weight:700;border-bottom:2px solid var(--line)}
  .item .n{font:500 22px var(--mono);color:var(--acc);width:70px;align-self:flex-start;margin-top:22px}
  .item .en{display:block;font:500 20px var(--mono);letter-spacing:.2em;color:var(--mute);margin-top:8px}
  .tag{position:absolute;font:500 20px var(--mono);letter-spacing:.2em;color:var(--mute)}
  .badge{display:inline-flex;align-items:center;justify-content:center;width:150px;height:150px;border:6px solid var(--acc);border-radius:50%;color:var(--acc);font:900 64px var(--sans)}
  .brand{font-size:54px;font-weight:700;margin-top:18px}
</style>
</head>
<body>
<div id="stage">
  <div class="glow"></div>
  <div class="progress" id="prog"></div>

  <!-- 0–3s 开场 -->
  <div class="scene" id="sc0">
    <div id="dia" style="position:absolute;left:50%;top:700px;width:150px;height:150px;margin:-75px 0 0 -75px;background:var(--acc);transform:rotate(45deg) scale(0)"></div>
    <div id="hello" class="title" style="left:0;right:0;top:880px;text-align:center;font-size:72px;font-weight:300;letter-spacing:.1em;opacity:0">你好，我是</div>
    <div id="haikuWord" class="title" style="left:0;right:0;top:1040px;text-align:center;font-size:200px;opacity:0">Haiku</div>
  </div>

  <!-- 3–6s 设计原则 -->
  <div class="scene" id="sc1">
    <div class="lbl" style="left:90px;top:200px">03 · 设计原则</div>
    <div class="title" id="p1" style="left:90px;top:280px;font-size:140px;opacity:0">节奏</div>
    <div class="tag" id="p1s" style="left:90px;top:440px;color:var(--acc);opacity:0">0.3 — 0.6 秒</div>
    <div class="title" id="p2" style="left:90px;top:620px;font-size:140px;opacity:0">缓动</div>
    <div class="tag" id="p2s" style="left:90px;top:780px;color:var(--acc);opacity:0">POWER · BACK · EXPO</div>
    <div class="title" id="p3" style="left:90px;top:960px;font-size:140px;opacity:0">层级</div>
    <div class="tag" id="p3s" style="left:90px;top:1120px;color:var(--acc);opacity:0">先出现的最重要</div>
    <div class="title" id="p4" style="left:90px;top:1300px;font-size:140px;opacity:0">留白</div>
    <div class="tag" id="p4s" style="left:90px;top:1460px;color:var(--acc);opacity:0">空白也是设计</div>
  </div>

  <!-- 6–12s 核心能力 -->
  <div class="scene" id="sc2">
    <div class="lbl" style="left:90px;top:200px">04 · 核心能力</div>
    <div class="item" id="c1" style="top:280px"><span class="n">01</span>动态排版</div>
    <div class="item" id="c2" style="top:420px"><span class="n">02</span>动效系统</div>
    <div class="item" id="c3" style="top:560px"><span class="n">03</span>数据动效</div>
    <div class="item" id="c4" style="top:700px"><span class="n">04</span>分镜到成片</div>
    <div class="item" id="c5" style="top:840px"><span class="n">05</span>可复现的确定性渲染</div>
  </div>

  <!-- 12–16s 工作流程 -->
  <div class="scene" id="sc3">
    <div class="lbl" style="left:90px;top:200px">05 · 工作流程</div>
    <div id="flowLine" style="position:absolute;left:100px;top:330px;width:3px;height:0;background:var(--acc)"></div>
    <div class="title" id="f1" style="left:150px;top:300px;font-size:64px;opacity:0">理解需求</div>
    <div class="title" id="f2" style="left:150px;top:460px;font-size:64px;opacity:0">分镜规划</div>
    <div class="title" id="f3" style="left:150px;top:620px;font-size:64px;opacity:0">动效实现</div>
    <div class="title" id="f4" style="left:150px;top:780px;font-size:64px;opacity:0">校验审查</div>
    <div class="title" id="f5" style="left:150px;top:940px;font-size:64px;opacity:0">确定渲染</div>
  </div>

  <!-- 16–20s 收尾大字 -->
  <div class="scene" id="sc4">
    <div class="title" id="close1" style="left:90px;top:620px;font-size:130px;opacity:0">每一帧，<br><span class="hl">都有意图。</span></div>
    <div class="sub" id="close2" style="left:90px;top:920px;opacity:0">期待你的下一个项目。</div>
    <div class="watermark" style="top:1500px;font-size:300px">HAIKU</div>
  </div>

  <!-- 20–25s 角色定位 -->
  <div class="scene" id="sc5">
    <div class="tag" style="left:90px;top:760px">CLAUDE · HAIKU 5.5</div>
    <div class="title" id="role1" style="left:90px;top:820px;font-size:110px;font-weight:300;opacity:0">我是一名</div>
    <div class="title hl" id="role2" style="left:90px;top:980px;font-size:150px;opacity:0">动态设计师</div>
    <div class="watermark" style="top:1560px;font-size:380px;text-align:left;left:90px">动效</div>
  </div>

  <!-- 25–30s 精选作品 + 收尾 -->
  <div class="scene" id="sc6">
    <div class="lbl" style="left:90px;top:200px">02 · 精选作品</div>
    <div class="item" id="w1" style="top:280px"><span class="n">01</span>弹性排版<span class="en" style="display:none"></span></div>
    <div class="item" id="w2" style="top:440px"><span class="n">02</span>形变动画</div>
    <div class="item" id="w3" style="top:600px"><span class="n">03</span>数据动效</div>
    <div class="item" id="w4" style="top:760px"><span class="n">04</span>路径绘制</div>
    <div id="endWrap" style="opacity:0">
      <div style="position:absolute;left:0;right:0;top:1180px;text-align:center"><div class="badge" style="margin:0 auto">5.5</div><div class="brand">Haiku</div></div>
    </div>
  </div>
</div>

<script>
const DURATION = 30;
const $ = id => document.getElementById(id);
const ease = {
  out:  t => 1 - Math.pow(1 - t, 3),
  quart:t => 1 - Math.pow(1 - t, 4),
  back: t => { const c=1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); },
  io:   t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2
};
const seg = (t,a,b,fn=ease.out) => t<=a?0:t>=b?1:fn((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;

// 场景切换点（秒），每个切换是自下而上的擦除，持续 0.32s
const CUTS = [2.9, 5.9, 11.9, 16.4, 20.4, 24.9];
const SCENES = ["sc0","sc1","sc2","sc3","sc4","sc5","sc6"];

function wipeFactor(t, cut){
  // 0 → 1：从 0 到 1 擦除；easeOutQuart 0.32s
  return seg(t, cut, cut+0.32, ease.quart);
}
// 擦除边缘：一条橙色带，让切换帧有明显像素变化（与原片一致）
(function ensureEdge(){
  // 橙色幕布：整屏覆盖色块，从底部上推（与原片切换一致）
  const e=document.createElement("div");
  e.id="wipeEdge";
  e.style.cssText="position:absolute;left:0;right:0;top:0;height:1920px;background:#f0553a;z-index:15;pointer-events:none;opacity:0";
  $("stage").appendChild(e);
})();

// 逐字入场：把元素拆成字符，按延迟逐个显现（原片列表项为逐字揭示）
function splitChars(el){
  if(el.dataset.split) return;
  // 只拆正文文本节点，保留序号 span（.n）
  const nodes=[...el.childNodes].filter(n=>n.nodeType===3 && n.textContent.trim());
  nodes.forEach(n=>{
    const frag=document.createDocumentFragment();
    [...n.textContent].forEach(ch=>{
      const s=document.createElement("span"); s.className="ch"; s.style.display="inline-block"; s.style.opacity="0"; s.textContent=ch; frag.appendChild(s);
    });
    n.replaceWith(frag);
  });
  el.dataset.split = "1";
}
function revealChars(el, t, start, span){
  const chars = el.querySelectorAll(".ch");
  const n = chars.length || 1;
  chars.forEach((c,i)=>{
    const s = start + (i/n)*span;
    c.style.opacity = seg(t, s, s+0.12);
  });
}

function frame(t){
  $("prog").style.width = (t/DURATION*100)+"%";

  // 切换：当前场景被擦除，下一场景从底部升起
  SCENES.forEach((id,i)=>{ $(id).style.opacity = 0; $(id).style.clipPath = "inset(0 0 0 0)"; });
  let cur = 0;
  for(let i=0;i<CUTS.length;i++){ if(t>=CUTS[i]) cur = i+1; }
  const cutT = cur>0 ? CUTS[cur-1] : -999;
  const k = wipeFactor(t, cutT);
  const incoming = SCENES[cur];
  const outgoing = cur>0 ? SCENES[cur-1] : null;
  $(incoming).style.opacity = 1;
  $(incoming).style.clipPath = `inset(${(1-k)*100}% 0 0 0)`;
  if(outgoing){ $(outgoing).style.opacity = 1; $(outgoing).style.clipPath = `inset(0 0 ${k*100}% 0)`; }
  // 擦除边缘带：随 k 从底部推到顶部，擦除期间可见
  const edge=$("wipeEdge");
  // 橙色幕布：在擦除期间覆盖整屏，随 k 从底部上推（k=0 时完全在屏幕下方，k=0.5 时覆盖下半屏）
  edge.style.top = (1920*(1-k))+"px";
  edge.style.height = "1920px";
  edge.style.opacity = (k>0 && k<1) ? 1 : 0;

  // 当前场景内部的入场
  const local = (s,a)=>t - (s+a);

  // sc0 开场
  const d0 = seg(t,0,0.9,ease.back);
  $("dia").style.transform = `rotate(45deg) scale(${d0})`;
  $("hello").style.opacity = seg(t,1.0,1.5);
  $("haikuWord").style.opacity = seg(t,2.2,2.7);

  // sc1 设计原则：逐项入场（间隔 0.25s）
  [["p1",3.1],["p2",3.35],["p3",3.6],["p4",3.85]].forEach(([id,s])=>{
    const kk = seg(t,s,s+0.4); $(id).style.opacity = kk; $(id).style.transform = `translateY(${lerp(24,0,kk)}px)`;
  });
  [["p1s",3.3],["p2s",3.55],["p3s",3.8],["p4s",4.05]].forEach(([id,s])=>{ $(id).style.opacity = seg(t,s,s+0.3); });

  // sc2 核心能力：逐字显现（原片为逐字揭示，每项间隔 0.25s）
  ["c1","c2","c3","c4","c5"].forEach((id,i)=>{
    const el=$(id); const s = 6.3 + i*0.25;
    splitChars(el); revealChars(el, t, s, 0.5);
    el.style.opacity = 1;
  });


  // sc3 工作流：竖线生长 + 节点逐项
  $("flowLine").style.height = (seg(t,12.4,13.4,ease.io)*600)+"px";
  ["f1","f2","f3","f4","f5"].forEach((id,i)=>{
    const s = 12.6 + i*0.2; const kk = seg(t,s,s+0.4); $(id).style.opacity = kk; $(id).style.transform = `translateX(${lerp(20,0,kk)}px)`;
  });

  // sc4 收尾大字
  $("close1").style.opacity = seg(t,16.6,17.1);
  $("close1").style.transform = `translateY(${lerp(20,0,seg(t,16.6,17.1))}px)`;
  $("close2").style.opacity = seg(t,17.4,17.9);
  document.querySelector("#sc4 .watermark").style.opacity = seg(t,16.8,17.6)*0.9;

  // sc5 角色定位
  $("role1").style.opacity = seg(t,20.6,21.1);
  $("role2").style.opacity = seg(t,21.0,21.6);
  $("role2").style.transform = `translateY(${lerp(20,0,seg(t,21.0,21.6))}px)`;
  document.querySelector("#sc5 .watermark").style.opacity = seg(t,21.2,22.0)*0.9;

  // sc6 精选作品 + 收尾
  ["w1","w2","w3","w4"].forEach((id,i)=>{
    const s = 25.2 + i*0.2; const kk = seg(t,s,s+0.4); $(id).style.opacity = kk; $(id).style.transform = `translateX(${lerp(-24,0,kk)}px)`;
  });
  $("endWrap").style.opacity = seg(t,27.2,27.8);
}

let startT=null, playing=false;
function loop(now){
  if(!playing) return;
  if(startT===null) startT=now;
  frame(((now-startT)/1000) % DURATION);
  requestAnimationFrame(loop);
}
function play(){ startT=null; playing=true; requestAnimationFrame(loop); }
function seek(t){ playing=false; frame(t); }
const q=new URLSearchParams(location.search);
if(q.has("t")) seek(parseFloat(q.get("t")));
else play();
window.__seek = seek;
</script>
</body>
</html>
